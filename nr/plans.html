<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#2b2825;--off:#fff;--bg:#f8f6f2;--mid:#888078;
  --accent:#b8935a;--accent-text:#826538;--border:rgba(17,16,16,.1);

html{scroll-behavior:smooth}

/* ─── Shared design tokens (index.html と統一) ─── */
.wrap{max-width:1440px;margin:0 auto;padding:clamp(4rem,10vw,9rem) clamp(1.5rem,5vw,5rem)}

.sec-rule{flex:1;height:1px;background:var(--border);min-width:20px}
.section-body-text{font-family:var(--serif);font-weight:300;font-size:.9rem;color:var(--mid);line-height:2.1;white-space:pre-line;margin-bottom:2.5rem}

.section-body-text{width:fit-content;max-width:100%;margin-left:auto!important;margin-right:auto!important;text-align:left!important}
.btn-line{display:inline-block;font-family:var(--sans);font-weight:400;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border:1px solid var(--ink);padding:.85rem 2rem;text-decoration:none;transition:all .3s}

/* ─── Nav ─── */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid rgba(17,16,16,.12);/* iOSで固定ヘッダーがスクロール中にページ途中へ取り残されるため、GPUレイヤーに分離して合成を安定させる */transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform;}
.nav-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:0 clamp(1rem,3vw,2.5rem);height:64px;gap:1rem}
.back-link{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--sans);font-weight:400;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:.55rem .9rem;border:1px solid var(--ink);transition:background .2s,color .2s}

.nav-right .booking-btn:hover{background:var(--accent)}

/* ─── Plans grid (index.html の plans-grid と統一) ─── */
.plans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--border)}
.plan-card{background:#fff;padding:0;position:relative;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:background .35s var(--ease)}

.plan-cta{font-family:var(--sans);font-weight:400;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);margin-top:auto;align-self:flex-start;padding-bottom:.3rem;border-bottom:1px solid var(--ink);transition:color .35s,border-color .35s}
.plan-card:hover .plan-name,.plan-card:hover .plan-desc,.plan-card:hover .plan-meta{color:rgba(255,255,255,.75)}
.plan-card:hover .plan-cta{color:#fff;border-bottom-color:#fff}
.plan-card.soon{pointer-events:none;opacity:.7}
.plan-card.soon .plan-price,.plan-card.soon .plan-cta{color:var(--mid);border-bottom-color:var(--mid)}

.plans-soon{display:block;text-align:center;padding:4rem 1.5rem;font-family:var(--display);font-style:normal;font-size:1.25rem;color:var(--mid)}

/* ─── Footer ─── */
footer{border-top:1px solid var(--border);background:#fff;color:var(--mid);padding:2rem clamp(1.5rem,5vw,4rem);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1.2rem;font-family:var(--sans);font-weight:300;font-size:.7rem;letter-spacing:.08em}

.footer-links a:hover{color:var(--ink)}
.footer-copy{font-size:.66rem;letter-spacing:.1em}.footer-logo{order:1}.footer-copy{order:2}.footer-links{order:3;flex-basis:100%;justify-content:center;margin:.2rem 0}footer{flex-direction:column;align-items:center;text-align:center;justify-content:flex-start}

}

<style>
/* 七五三 撮影メニュー（紙の料金表に合わせた構成）。
   総額 = ①撮影料金 ＋ ②プラン ＋ ③オプション。プラン価格だけを大きく出すと
   総額と誤解されるため、①→②→③ の積み上げが見て分かる並びにしている。 */
.mn-eyebrow{font-family:var(--sans);font-size:.62rem;letter-spacing:.26em;color:var(--accent-text);text-align:center;margin-bottom:.5rem}
.mn-title{font-family:var(--display);font-weight:300;font-size:clamp(1.3rem,3.4vw,1.9rem);letter-spacing:.14em;text-align:center;margin:0 0 1rem}
.mn-lead{font-family:var(--serif);font-size:.82rem;line-height:1.95;color:var(--mid);text-align:center;max-width:620px;margin:0 auto 2.6rem}
.mn-lead b{font-weight:400;color:var(--ink)}
.mn-step{display:flex;align-items:center;gap:.6rem;margin:0 0 .9rem;flex-wrap:wrap}
.mn-no{font-family:var(--display);font-size:1.15rem;color:var(--accent-text);line-height:1}
.mn-tag{font-family:var(--sans);font-size:.56rem;letter-spacing:.14em;padding:.2rem .5rem;border:1px solid currentColor}
.mn-tag.req{color:var(--accent-text)}
.mn-tag.opt{color:var(--mid)}
.mn-step h3{font-family:var(--serif);font-weight:400;font-size:.95rem;letter-spacing:.06em;margin:0}
.mn-step h3 small{font-family:var(--sans);font-weight:300;font-size:.68rem;color:var(--mid);margin-left:.6rem}
.mn-fee{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:1.4rem}
.mn-fee-i{background:#fff;padding:.85rem 1rem;display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.mn-fee-i span{font-family:var(--serif);font-size:.82rem}
.mn-fee-i b{font-family:var(--display);font-weight:400;font-size:1.1rem;white-space:nowrap;font-variant-numeric:lining-nums}
.mn-plus{text-align:center;font-family:var(--display);font-size:1.3rem;color:var(--accent-text);margin:.2rem 0 1.4rem}
.mn-plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:1.4rem}
.mn-plan{background:#fff;padding:1.3rem 1.2rem;display:flex;flex-direction:column}
.mn-plan-n{font-family:var(--serif);font-weight:400;font-size:.95rem;letter-spacing:.04em}
.mn-plan-en{font-family:var(--sans);font-weight:300;font-size:.56rem;letter-spacing:.16em;color:var(--accent-text);margin:.25rem 0 .7rem}
.mn-plan-p{font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1;font-variant-numeric:lining-nums}
.mn-plan-p em{font-style:normal;font-size:.6rem;font-family:var(--sans);color:var(--mid);margin-left:.35rem}
.mn-plan ul{list-style:none;padding:.9rem 0 0;margin:.9rem 0 0;border-top:1px solid var(--border);font-family:var(--serif);font-size:.76rem;line-height:1.9;color:var(--mid)}
.mn-plan li::before{content:'・';color:var(--accent-text)}
.mn-add{border:1px solid var(--accent);padding:.9rem 1.1rem;font-family:var(--serif);font-size:.82rem;line-height:1.9;text-align:center;margin-bottom:1.4rem}
.mn-add b{font-weight:400;color:var(--accent-text)}
.mn-add small{display:block;font-size:.72rem;color:var(--mid);margin-top:.3rem}
.mn-ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:2.6rem}
.mn-ex-i{background:#fff;padding:.9rem 1.1rem;font-family:var(--serif);font-size:.76rem;line-height:1.9;color:var(--mid)}
.mn-ex-i b{display:block;font-weight:400;color:var(--ink);font-size:.8rem;margin-bottom:.2rem}
.mn-ex-i i{font-style:normal;font-family:var(--display);font-size:1.05rem;color:var(--ink);font-variant-numeric:lining-nums}
.mn-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:1.6rem}
.mn-og{background:#fff;padding:1.1rem 1.2rem}
.mn-og-t{font-family:var(--serif);font-weight:400;font-size:.84rem;letter-spacing:.04em;padding-bottom:.5rem;margin-bottom:.5rem;border-bottom:1px solid var(--border)}
.mn-og-t small{display:block;font-family:var(--sans);font-weight:300;font-size:.54rem;letter-spacing:.16em;color:var(--accent-text);margin-top:.2rem}
.mn-og dl{display:grid;grid-template-columns:1fr auto;gap:.3rem .8rem;margin:0;font-family:var(--serif);font-size:.78rem;line-height:1.7}
.mn-og dt{color:var(--mid)}
.mn-og dd{margin:0;text-align:right;white-space:nowrap;font-variant-numeric:lining-nums}
.mn-og p{font-family:var(--serif);font-size:.68rem;line-height:1.75;color:var(--mid);margin:.5rem 0 0}
.mn-og .sub{grid-column:1/-1;font-size:.62rem;color:var(--mid);margin-top:-.1rem}
/* メニューごとのブロック。ここを視覚的に閉じておかないと、
   七五三の「ハイシーズン +¥5,500」が下の Birthday にも掛かって読めてしまう。 */
.mn-sheet{padding-top:2.6rem}
.mn-sheet + .mn-sheet{margin-top:3rem;border-top:1px solid var(--border)}
.mn-plan-note{font-family:var(--serif);font-size:.7rem;line-height:1.75;color:var(--mid);margin-top:.5rem}
/* プランが1つだけのメニュー（Birthday）は、カードを横いっぱいに伸ばさない */
.mn-plans.one{grid-template-columns:minmax(0,360px);justify-content:center}
.mn-notes{list-style:none;padding:1.1rem 1.2rem;margin:0;border:1px solid var(--border);font-family:var(--serif);font-size:.74rem;line-height:1.95;color:var(--mid)}
.mn-notes li::before{content:'※ '}
@media(max-width:640px){
  .mn-fee-i{padding:.7rem .85rem}
  .mn-plan{padding:1.1rem 1rem}
}
</style>
</head>

<script>
const STUDIO_KEY = location.pathname.includes('/nr/') ? 'nr' : 'et';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function minPriceFromVariants(variants){
  if(!variants || variants.length === 0) return '';
  const nums = variants.map(v=>{
    const m = String(v.price||'').match(/[\d,]+/g);
    return m ? parseInt(m.join('').replace(/,/g,'')) : NaN;
  }).filter(n=>!isNaN(n));
  if(nums.length === 0) return variants[0].price || '';
  const min = Math.min(...nums);
  return `¥${min.toLocaleString()}〜`;
}

/* ── 紙の料金表（studios.nr.menuSheets）を描く ──
   金額はすべてここで site-data.js から取る。HTMLに直書きしないこと。
   メニューごとに1ブロックで、加算の注記もブロックの中に閉じる。
   ページ全体に掛かる注記を作ると、七五三のハイシーズン加算が
   Birthday にも掛かって読めてしまう。 */
const yenNum = (n) => '¥' + Number(n).toLocaleString('ja-JP');

function mnFees(items){
  return '<div class="mn-fee">' + items.map((f) =>
    '<div class="mn-fee-i"><span>' + esc(f.label) + '</span><b>' + yenNum(f.price) + '</b></div>'
  ).join('') + '</div>';
}
function mnPlans(items){
  const cls = items.length === 1 ? 'mn-plans one' : 'mn-plans';
  return '<div class="' + cls + '">' + items.map((p) =>
    '<div class="mn-plan">'
    + '<div class="mn-plan-n">' + esc(p.name) + '</div>'
    + (p.en ? '<div class="mn-plan-en">' + esc(p.en) + '</div>' : '')
    + '<div class="mn-plan-p">' + yenNum(p.price) + '<em>税込</em></div>'
    + '<ul class="mn-plan-l">' + (p.includes || []).map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>'
    + (p.note ? '<div class="mn-plan-note">（' + esc(p.note) + '）</div>' : '')
    + '</div>'
  ).join('') + '</div>';
}
function mnOptionGroups(items){
  return '<div class="mn-opts">' + items.map((g) => {
    const rows = (g.rows || []).map((r) => {
      if (r.head) return '<dd class="sub">' + esc(r.head) + '</dd>';
      return '<dt>' + esc(r.name) + '</dt><dd>' + esc(r.price) + '</dd>'
        + (r.sub ? '<dd class="sub">' + esc(r.sub) + '</dd>' : '');
    }).join('');
    return '<div class="mn-og">'
      + '<div class="mn-og-t">' + esc(g.title) + (g.en ? '<small>' + esc(g.en) + '</small>' : '') + '</div>'
      + '<dl>' + rows + '</dl>'
      + (g.note ? '<p>' + esc(g.note) + '</p>' : '')
      + '</div>';
  }).join('') + '</div>';
}

function renderMenuSheets(studio){
  const host = document.getElementById('mn-sheets');
  if(!host) return;
  const sheets = studio.menuSheets || [];
  if(sheets.length === 0){
    host.innerHTML = '<p class="mn-lead">料金表は準備中です。</p>';
    return;
  }
  host.innerHTML = sheets.map((sh) => {
    const steps = (sh.steps || []).map((st) => {
      const head = '<div class="mn-step"><span class="mn-no">' + esc(st.no) + '</span>'
        + '<span class="mn-tag ' + (st.req ? 'req">必須' : 'opt">任意') + '</span>'
        + '<h3>' + esc(st.title) + (st.sub ? '<small>' + esc(st.sub) + '</small>' : '') + '</h3></div>';
      let body = '';
      if(st.type === 'fees') body = mnFees(st.items || []);
      else if(st.type === 'plans') body = mnPlans(st.items || []);
      else if(st.type === 'optionGroups') body = mnOptionGroups(st.items || []);
      return head + body;
    });
    // ① と ② のあいだの ＋（3ステップ構成のときだけ出す）
    const joined = steps.length >= 3
      ? steps[0] + '<div class="mn-plus">＋</div>' + steps.slice(1).join('')
      : steps.join('');
    const add = sh.surcharge
      ? '<div class="mn-add">' + sh.surcharge.text
        + (sh.surcharge.note ? '<small>' + esc(sh.surcharge.note) + '</small>' : '') + '</div>'
      : '';
    const ex = (sh.examples || []).length
      ? '<div class="mn-ex">' + sh.examples.map((e) =>
          '<div class="mn-ex-i"><b>' + e.title + '</b>' + esc(e.body) + '<i>' + esc(e.total) + '</i></div>'
        ).join('') + '</div>'
      : '';
    const notes = (sh.notes || []).length
      ? '<ul class="mn-notes">' + sh.notes.map((n) => '<li>' + n + '</li>').join('')
        + '<li>表示価格はすべて税込です。</li></ul>'
      : '';
    // ②（プラン）のあとに加算と計算例を置く。オプションはそのあと
    const parts = joined.split('<div class="mn-step"><span class="mn-no">' + esc((sh.steps[sh.steps.length-1]||{}).no));
    const beforeOpt = parts[0];
    const optPart = parts.length > 1
      ? '<div class="mn-step"><span class="mn-no">' + esc(sh.steps[sh.steps.length-1].no) + parts.slice(1).join('')
      : '';
    return '<section class="mn-sheet">'
      + '<p class="mn-eyebrow">' + esc(sh.eyebrow) + '</p>'
      + '<h2 class="mn-title">' + esc(sh.title) + '</h2>'
      + '<p class="mn-lead">' + sh.lead + '<br/>表示価格はすべて税込です。</p>'
      + beforeOpt + add + ex + optPart + notes
      + '</section>';
  }).join('');
}

function render(){
  const data = window.SITE_DATA;
  if(!data) return;
  const studio = data.studios[STUDIO_KEY];
  if(!studio) return;

  if(studio.accentColor) document.documentElement.style.setProperty('--accent', studio.accentColor);

  const name = studio.shortName || studio.name || '';
  document.getElementById('nav-brand').innerHTML = '<img src="../assets/nr-logo.png" alt="Maison nr." style="height:34px;width:auto;display:block;margin:0 auto;filter:brightness(0)"/>';

  document.getElementById('footer-copy').textContent = data.global.copyright;
  document.getElementById('page-title').textContent = `Plans | ${studio.name}`;

  const leadEl = document.getElementById('page-lead');
  if(studio.plansLead && leadEl){
    leadEl.innerHTML = esc(studio.plansLead).replace(/\n/g,'<br/>');
  }

  renderMenuSheets(studio);

  const plans = studio.plans || [];
  const grid = document.getElementById('pl-grid');
  /* このページは #mn-sheets に紙の料金表を描くので #pl-grid / #page-lead が無い。
     カード描画はスキップする（この return を消すと空のグリッドが出る）。 */
  if(!grid){ document.body.classList.add('is-ready'); return; }

  if(plans.length === 0){
    grid.innerHTML = '<div class="plans-soon" style="grid-column:1/-1">プラン情報は近日公開予定です。</div>';
    document.body.classList.add('is-ready');
    return;
  }

  grid.innerHTML = plans.map(p=>{
    const hasDetail = p.detail && p.variants && p.variants.length > 0;
    const heroImg = hasDetail ? (p.detail.heroImage || '') : '';
    const price = hasDetail ? minPriceFromVariants(p.variants) : '';
    const cutsList = hasDetail ? [...new Set(p.variants.map(v=>v.cuts).filter(c=>c!=null))].join(' / ') : '';
    const cardClass = hasDetail ? 'plan-card' : 'plan-card soon';
    const cardHref = hasDetail ? `plan-detail.html?key=${encodeURIComponent(p.key)}` : 'javascript:void(0)';

    return `
      <a href="${cardHref}" class="${cardClass}">
        <div class="plan-card-img">${heroImg ? `<div class="plan-card-img-inner" style="background-image:url('${esc(heroImg)}')"></div>` : ''}</div>
        <div class="plan-card-body">
          ${p.tag ? `<div class="plan-tag">${esc(p.tag)}</div>` : ''}
          <div class="plan-name">${esc(p.name)}</div>
          <div class="plan-price">${esc(price || '近日公開')}</div>
          <div class="plan-desc">${esc(p.desc || '')}</div>
          ${cutsList ? `<div class="plan-meta">${esc(cutsList)} cuts available</div>` : ''}
          <div class="plan-cta">${hasDetail ? 'View detail →' : 'Coming soon'}</div>
        </div>
      </a>
    `;
  }).join('');

  document.body.classList.add('is-ready');
}

setTimeout(()=>document.body.classList.add('is-ready'), 1200);
render();
</script>
<script>
// 予約する › 展開メニュー(TOPページと同仕様)
function toggleHdrBook(e){
  e.stopPropagation();
  const wrap = e.currentTarget.closest('.hdr-book-wrap');
  const m = wrap.querySelector('.hdr-book-menu');
  const open = m.hidden;
  document.querySelectorAll('.hdr-book-menu').forEach(x=>{ x.hidden = true; });
  document.querySelectorAll('.hdr-book-toggle').forEach(b=>b.setAttribute('aria-expanded','false'));
  m.hidden = !open;
  e.currentTarget.setAttribute('aria-expanded', open ? 'true' : 'false');
}
(function(){
  function closeIfOutside(ev){
    if(!(ev.target instanceof Element) || !ev.target.closest('.hdr-book-wrap')){
      document.querySelectorAll('.hdr-book-menu').forEach(x=>{ x.hidden = true; });
      document.querySelectorAll('.hdr-book-toggle').forEach(b=>b.setAttribute('aria-expanded','false'));
    }
  }
  document.addEventListener('pointerdown', closeIfOutside, {capture:true, passive:true});
  document.addEventListener('touchstart', closeIfOutside, {capture:true, passive:true});
  // ヘッダーのマップ/Instagram リンクを site-data から設定
  var key = location.pathname.includes('/nr/') ? 'nr' : 'et';
  var d = (window.SITE_DATA && SITE_DATA.studios) ? SITE_DATA.studios[key] : null;
  if(d){
    var m=document.getElementById('sub-map'); if(m && d.mapUrl) m.href=d.mapUrl;
    var g=document.getElementById('sub-ig'); if(g && d.instagram) g.href=d.instagram;
  }
})();
</script>
<script>
// フロート: トップへ戻る + 予約シート開閉(TOPページ準拠)
(function(){
  var b=document.getElementById('to-top-btn');
  if(b){ window.addEventListener('scroll', function(){ b.classList.toggle('show', window.scrollY>400); }, {passive:true}); }
})();
function openBookSheet(){
  var s=document.getElementById('book-sheet'); if(s) s.hidden=false;
  document.body.classList.add('sheet-open');
  var t=document.getElementById('book-toggle'); if(t) t.hidden=true;
}
function closeBookSheet(){
  var s=document.getElementById('book-sheet'); if(s) s.hidden=true;
  document.body.classList.remove('sheet-open');
  var t=document.getElementById('book-toggle'); if(t) t.hidden=false;
}
</script>
